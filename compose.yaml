services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: healthplus
      POSTGRES_PASSWORD: healthplus_local
      POSTGRES_DB: healthplus_db
    volumes:
      - healthplus-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthplus -d healthplus_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow:
    build: .
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/healthplus/dags
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: healthplus_db
      DB_USER: healthplus
      DB_PASSWORD: healthplus_local
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - airflow-home:/opt/airflow
      - ./dags:/opt/healthplus/dags:ro
      - ./src:/opt/healthplus/src:ro
      - ./data:/opt/healthplus/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  airflow-home:
  healthplus-postgres:
